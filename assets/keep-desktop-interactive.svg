<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title description">
  <title id="title">KeepDesktopInteractive: close the window, not your automation</title>
  <desc id="description">Concept illustration. Before setup, disconnecting or minimizing remote desktop can interrupt UI automation. With host console handoff and a compatible client's minimized-rendering setting, the same user's automation can continue. Verify client support on each setup.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111a30"/>
      <stop offset="1" stop-color="#090e1a"/>
    </linearGradient>
    <linearGradient id="active" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b3842"/>
      <stop offset="1" stop-color="#142231"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" rx="24" fill="url(#background)"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="48" y="38" width="8" height="26" rx="4" fill="#69e4ca"/>
    <text x="70" y="61" fill="#e3eaf5" font-size="24" font-weight="600">KeepDesktopInteractive</text>
    <text x="48" y="128" fill="#f4f7fc" font-size="48" font-weight="700">Close the window.</text>
    <text x="48" y="185" fill="#69e4ca" font-size="48" font-weight="700">Not your automation.</text>
    <text x="48" y="224" fill="#b2bfd3" font-size="22">Disconnect or minimize without losing the desktop your tests need.</text>

    <rect x="48" y="258" width="496" height="192" rx="18" fill="#151e30" stroke="#344055"/>
    <text x="72" y="293" fill="#e7a3a7" font-size="17" font-weight="700" letter-spacing="2">BEFORE SETUP</text>
    <rect x="76" y="320" width="116" height="78" rx="8" fill="#101725" stroke="#7e525d" stroke-width="2"/>
    <path d="M76 340 H192" stroke="#7e525d" stroke-width="2"/>
    <circle cx="87" cy="330" r="3" fill="#e7a3a7"/>
    <path d="M124 356 L145 377 M145 356 L124 377" stroke="#f08a95" stroke-width="4" stroke-linecap="round"/>
    <path d="M134 399 V414 M111 414 H157" stroke="#7e525d" stroke-width="3" stroke-linecap="round"/>
    <text x="217" y="347" fill="#f1e6e9" font-size="24" font-weight="600">Apps still running.</text>
    <text x="217" y="382" fill="#f08a95" font-size="24" font-weight="600">Automation stuck.</text>
    <text x="217" y="414" fill="#afbbce" font-size="18">No usable input or screenshots</text>

    <path d="M568 355 H619 M605 341 L619 355 L605 369" fill="none" stroke="#8795b0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="644" y="258" width="508" height="192" rx="18" fill="url(#active)" stroke="#426e70"/>
    <text x="668" y="293" fill="#8eeed7" font-size="17" font-weight="700" letter-spacing="2">AFTER SETUP</text>
    <rect x="672" y="320" width="116" height="78" rx="8" fill="#102b32" stroke="#69e4ca" stroke-width="2"/>
    <path d="M672 340 H788" stroke="#69e4ca" stroke-width="2"/>
    <circle cx="683" cy="330" r="3" fill="#69e4ca"/>
    <path d="M713 367 L725 379 L747 354" fill="none" stroke="#69e4ca" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M730 399 V414 M707 414 H753" stroke="#69e4ca" stroke-width="3" stroke-linecap="round"/>
    <text x="813" y="347" fill="#e6f8f4" font-size="24" font-weight="600">Same user session.</text>
    <text x="813" y="382" fill="#8eeed7" font-size="24" font-weight="600">Automation continues.</text>
    <text x="813" y="414" fill="#c0d2d8" font-size="18">Mouse + keyboard + screenshots</text>

    <circle cx="66" cy="493" r="18" fill="#22324c"/>
    <text x="66" y="500" text-anchor="middle" fill="#f4f7fc" font-size="20" font-weight="700">1</text>
    <text x="97" y="500" fill="#e3eaf5" font-size="23" font-weight="600">REMOTE HOST</text>
    <text x="97" y="530" fill="#b2bfd3" font-size="20">Install disconnect handoff</text>
    <circle cx="662" cy="493" r="18" fill="#22324c"/>
    <text x="662" y="500" text-anchor="middle" fill="#f4f7fc" font-size="20" font-weight="700">2</text>
    <text x="693" y="500" fill="#e3eaf5" font-size="23" font-weight="600">LOCAL CLIENT</text>
    <text x="693" y="530" fill="#b2bfd3" font-size="20">Keep rendering when minimized</text>
    <text x="48" y="574" fill="#9eacc2" font-size="17">Client support varies. Verify on your setup. Disconnect handoff leaves the desktop unlocked.</text>
  </g>
</svg>
