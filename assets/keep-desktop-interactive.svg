<svg xmlns="http://www.w3.org/2000/svg" width="700" height="740" viewBox="0 0 700 740" role="img" aria-labelledby="title desc">
  <title id="title">Step away. Keep your GUI agent working.</title>
  <desc id="desc">Three benefits: keep clicking and typing after disconnect; step away from the remote client; reuse your signed-in desktop without stored passwords. Minimized use needs a compatible client test. Console handoff leaves the desktop unlocked.</desc>
  <rect width="700" height="740" rx="24" fill="#f5f8fc"/>
  <g font-family="Segoe UI, Arial, sans-serif" fill="#13243b">
    <text x="350" y="42" font-size="36" font-weight="700" text-anchor="middle">Step away.</text>
    <text x="350" y="84" font-size="36" font-weight="700" text-anchor="middle">Keep your GUI agent working.</text>
    <rect x="20" y="110" width="660" height="164" rx="18" fill="#fff"/>
    <g transform="translate(-88 0)" stroke="#176b78" stroke-width="7" stroke-linejoin="round"><rect x="128" y="132" width="160" height="104" rx="10" fill="#e8f5f5"/>
      <path d="M208 236v22m-50 0h100" fill="none"/>
      <path d="m196 160 0 56 16-15 15 25 15-9-15-25 23-3z" fill="#176b78" stroke-width="2"/>
      <path d="m257 152 12 12 25-28" fill="none" stroke="#07876d"/></g>
    <text x="235" y="156" font-size="36" font-weight="700">Keep clicking</text>
    <text x="235" y="198" font-size="36" font-weight="700">+ typing</text>
    <text x="235" y="245" font-size="32" font-weight="400">After disconnect</text>
    <rect x="20" y="290" width="660" height="164" rx="18" fill="#fff"/>
    <g transform="translate(-480 166)" stroke="#176b78" stroke-width="7" stroke-linejoin="round"><rect x="520" y="146" width="160" height="94" rx="10" fill="#e8f5f5"/>
      <path d="M506 255h188l-14-15H520z" fill="#e8f5f5"/>
      <path d="M550 204h100" stroke="#176b78"/>
      <path d="m574 172 12 12 25-28" fill="none" stroke="#07876d"/></g>
    <text x="235" y="336" font-size="36" font-weight="700">Stop watching</text>
    <text x="235" y="378" font-size="36" font-weight="700">the window</text>
    <text x="235" y="425" font-size="32" font-weight="400">Minimize: test your client</text>
    <rect x="20" y="470" width="660" height="164" rx="18" fill="#fff"/>
    <g transform="translate(-872 360)" stroke="#176b78" stroke-width="7" stroke-linejoin="round"><rect x="912" y="132" width="160" height="104" rx="10" fill="#e8f5f5"/>
      <path d="M992 236v22m-50 0h100" fill="none"/>
      <circle cx="992" cy="164" r="15" fill="#176b78" stroke="none"/>
      <path d="M963 211c0-35 58-35 58 0" fill="#176b78" stroke="none"/>
      <path d="m1044 152 12 12 25-28" fill="none" stroke="#07876d"/></g>
    <text x="235" y="516" font-size="36" font-weight="700">Reuse your</text>
    <text x="235" y="558" font-size="36" font-weight="700">signed-in desktop</text>
    <text x="235" y="605" font-size="32" font-weight="400">No stored passwords</text>
    <text x="350" y="685" font-size="32" fill="#795319" text-anchor="middle">Console stays unlocked.</text>
    <text x="350" y="725" font-size="32" fill="#795319" text-anchor="middle">Use a trusted host.</text>
  </g>
</svg>
